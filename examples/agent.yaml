controller_address: controller.example.com:9443
server_name: controller.example.com
certificate_file: /etc/hlcp/agent.crt
private_key_file: /etc/hlcp/agent.key
ca_file: /etc/hlcp/ca.crt
node_id: example-node
agent_version: 0.1.0
capabilities: [resource.control, systemd]
resources:
  - id: example-catalog
    type: container
    adapter: docker
    target: example-catalog
    actions: [status, restart]
    state: unknown
