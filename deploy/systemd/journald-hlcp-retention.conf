# Install only in /etc/systemd/journald@hlcp.conf.d/10-retention.conf.
# Do not replace the machine-wide journald.conf.
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=128M
SystemKeepFree=256M
SystemMaxFileSize=8M
RuntimeMaxUse=32M
RuntimeKeepFree=32M
RuntimeMaxFileSize=4M
MaxRetentionSec=7day
MaxFileSec=1day
RateLimitIntervalSec=30s
RateLimitBurst=1000
ForwardToSyslog=no
ForwardToConsole=no
ForwardToWall=no
